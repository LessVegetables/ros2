name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w12-525e86f818ff.tar.gz
  COURSE_KIT_SHA256: 525e86f818ffed166e7f7b67cc87fdd3f3ea840d13aa90e76bde9fda0f3c9c5a
  PRACTICE: PR05

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checkout inside container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null

      - name: Install package dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro lyrical
          rosdep install --from-paths src --ignore-src -y -r --rosdistro lyrical

      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Download course kit
        shell: bash
        run: |
          python3 -c 'import os, urllib.request; urllib.request.urlretrieve(os.environ["COURSE_KIT_URL"], "course-kit.tar.gz")'
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
          rm course-kit.tar.gz

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py "$PRACTICE" --submission .
